<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Amor de Siempre 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;
    height:100vh;

    font-family:'Press Start 2P', cursive;

    background:
    linear-gradient(
    rgba(255,120,180,0.20),
    rgba(255,120,180,0.20)),
    url("fondo.webp");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* ESTRELLAS */

.stars{

    position:absolute;

    width:100%;
    height:100%;

    overflow:hidden;
}

.star{

    position:absolute;

    width:3px;
    height:3px;

    background:white;

    border-radius:50%;

    animation:blink 2s infinite;

    box-shadow:
    0 0 8px white;
}

@keyframes blink{

    0%,100%{
        opacity:0.2;
    }

    50%{
        opacity:1;
    }
}

/* LLUVIA DE CORAZONES */

.hearts{

    position:absolute;

    width:100%;
    height:100%;

    overflow:hidden;

    pointer-events:none;
}

.pixel-heart{

    position:absolute;

    width:55px;

    animation:fall linear infinite;

    image-rendering:pixelated;

    filter:
    drop-shadow(0 0 4px #ff4da6)
    drop-shadow(0 0 10px #ff006a);

    pointer-events:none;
    user-select:none;

    opacity:0.9;

    will-change:transform;
}

@keyframes fall{

    0%{
        transform:translateY(-100px);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(110vh);
        opacity:0;
    }
}

/* CONTENIDO */

.container{

    position:relative;

    z-index:5;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    width:100%;
}

/* CORAZON PRINCIPAL */

.heart-wrapper{

    animation:pulse 2s infinite;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:35px;
}

.main-heart{

    width:340px;

    image-rendering:pixelated;

    filter:
    drop-shadow(0 0 10px #ff4da6)
    drop-shadow(0 0 25px #ff0080);

    user-select:none;
    pointer-events:none;

    will-change:transform;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }
}

/* PANEL */

.music-box{

    background:rgba(0,0,0,0.42);

    border:4px solid #ff6fb5;

    border-radius:25px;

    padding:22px;

    width:560px;
    max-width:90%;

    color:white;

    backdrop-filter:blur(5px);

    box-shadow:
    0 0 20px #ff4da6;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;
}

/* TITULO */

.title{

    font-size:22px;

    color:white;

    text-shadow:
    0 0 8px #ff4da6,
    0 0 15px #ff0080;

    margin-bottom:20px;

    text-align:center;

    width:100%;

    line-height:1.5;
}

/* SUBTITULO */

.subtitle{

    font-size:12px;

    color:#ffd6ea;

    margin-bottom:18px;

    text-align:center;

    width:100%;
}

/* LINEA */

.line{

    margin:18px auto;

    width:80%;
    height:5px;

    border-radius:20px;

    background:#ff6fb5;

    box-shadow:
    0 0 8px #ff6fb5;
}

/* LETRA */

.lyrics{

    font-size:14px;

    color:#fff0f7;

    margin-top:18px;

    text-shadow:
    0 0 6px #ff80bf;

    text-align:center;

    width:100%;
}

/* MENSAJE */

.click-message{

    position:absolute;

    top:20px;
    left:20px;

    background:rgba(0,0,0,0.35);

    border:3px solid #ff6fb5;

    border-radius:18px;

    padding:18px;

    color:white;

    width:240px;

    font-size:11px;

    line-height:1.7;

    box-shadow:
    0 0 12px #ff4da6;
}

/* RESPONSIVE */

@media(max-width:768px){

    body{
        overflow:hidden;
    }

    .main-heart{
        width:220px;
    }

    .title{
        font-size:14px;
    }

    .subtitle{
        font-size:10px;
    }

    .lyrics{
        font-size:10px;
    }

    .music-box{
        width:90%;
        padding:16px;
        backdrop-filter:none;
    }

    .click-message{
        width:180px;
        font-size:9px;
        padding:12px;
    }

    .stars{
        opacity:0.7;
    }

    .pixel-heart{
        filter:
        drop-shadow(0 0 3px #ff4da6);
    }
}

</style>
</head>

<body>

<!-- AUDIO -->

<audio id="music" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- ESTRELLAS -->

<div class="stars" id="stars"></div>

<!-- LLUVIA -->

<div class="hearts" id="hearts"></div>

<!-- CONTENIDO -->

<div class="container">

    <!-- CORAZON -->

    <div class="heart-wrapper">
        <img src="corazon.webp" class="main-heart">
    </div>

    <!-- PANEL -->

    <div class="music-box">

        <div class="title">
             CUCO - Amor de Siempre 
        </div>

        <div class="subtitle">
             Haz clic para reproducir la música 
        </div>

        <div class="line"></div>

        <div class="lyrics">
            Eres mi amor de siempre... 
        </div>

    </div>

</div>

<script>

/* REPRODUCIR MUSICA */

document.body.addEventListener("click", () => {

    document.getElementById("music").play();

}, { once:true });

/* OPTIMIZACION */

const isMobile = window.innerWidth <= 768;

const STAR_COUNT = isMobile ? 40 : 120;
const HEART_COUNT = isMobile ? 45 : 140;

/* ESTRELLAS */

const stars = document.getElementById("stars");

for(let i=0;i<STAR_COUNT;i++){

    const star = document.createElement("div");

    star.classList.add("star");

    star.style.left = Math.random()*100 + "%";

    star.style.top = Math.random()*100 + "%";

    star.style.animationDuration =
    (Math.random()*3+1)+"s";

    stars.appendChild(star);
}

/* LLUVIA DE CORAZONES */

const hearts = document.getElementById("hearts");

for(let i=0;i<HEART_COUNT;i++){

    const heart = document.createElement("img");

    heart.classList.add("pixel-heart");

    heart.src = "lluvia.webp";

    heart.style.left =
    Math.random()*100 + "%";

    heart.style.animationDuration =
    (Math.random()*8+5)+"s";

    heart.style.animationDelay =
    Math.random()*5+"s";

    heart.style.width =
    (Math.random()*45+35)+"px";

    hearts.appendChild(heart);
}

</script>

</body>
</html>
